name: build changed studies
# When a study's inputs change on main (a merged submission, or a hand edit),
# run the readers for that study, commit the outputs, and deploy the site.
# Free on a public repo. Two lessons from the Atlas are honoured: no pipes into
# tee (the step would report tee's exit code), and a lost push race must not
# silently skip the deploy.
on:
  push:
    branches: [main]
    paths: ['studies/*/study.json', 'studies/*/places.json', 'studies/*/policy/**', 'studies/*/own/*.csv', 'studies/*/features.json']
  workflow_dispatch:
    inputs:
      study: { description: 'study id to (re)build', required: true }
concurrency: { group: build-study, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: which studies changed
        id: which
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.study }}" ]; then ids="${{ github.event.inputs.study }}"; else
            ids=$(git diff --name-only HEAD~1 HEAD -- studies | awk -F/ '{print $2}' | sort -u | grep -v '^_' | tr '\n' ' ' || true); fi
          echo "ids=$ids" >> "$GITHUB_OUTPUT"; echo "studies: $ids"
      - uses: actions/cache@v4
        with:
          path: |
            data/sources/hydrorivers
            data/sources/faostat
            data/sources/terrain
            data/sources/*.geojson
          key: sources-${{ runner.os }}-v1
      - name: run each changed study
        if: steps.which.outputs.ids != ''
        shell: bash
        run: |
          set -euo pipefail
          for id in ${{ steps.which.outputs.ids }}; do
            [ -f "studies/$id/study.json" ] || { echo "no manifest for $id"; continue; }
            node scripts/run.mjs "studies/$id/study.json" --skip=sources
            node scripts/readme.mjs "studies/$id/study.json"
          done
      - name: commit outputs
        if: steps.which.outputs.ids != ''
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "layercake-ci"; git config user.email "ci@layercake"
          git add -A studies web/data
          git commit -m "ci: built ${{ steps.which.outputs.ids }}" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4; do git pull --rebase -X theirs && git push && break || sleep $((i*5)); done
      - name: deploy
        if: steps.which.outputs.ids != '' && env.CF_TOKEN != ''
        env: { CF_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}', CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}', CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
        run: npx --yes wrangler pages deploy web --project-name=layercake --commit-dirty=true
